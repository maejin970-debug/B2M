name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova Globally
        run: npm install -g cordova

      - name: Add Android Platform & Install Plugins
        run: |
          cordova platform add android@12.0.0 --save
          cordova plugin add cordova-plugin-bluetooth-serial --save

      - name: Build Android APK
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTChat-Offline-App
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
