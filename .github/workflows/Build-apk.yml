name: Build Signal Link APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI and core packages (pinned)
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/android@6.2.0 --save
          npm install @capacitor/cli@6.2.0 --save-dev

      - name: Install Bluetooth Serial plugin
        run: npm install cordova-plugin-bluetooth-serial --save

      - name: Verify www/ contains the app
        run: |
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found. Make sure the app HTML is committed at www/index.html"
            exit 1
          fi

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.maejin.signallink",
            "appName": "Signal Link",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor (copies www + plugins into native project)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Inject required Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Insert Bluetooth + storage permissions right after the opening <manifest ...> tag if not already present
          python3 - << 'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()

          permissions = [
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',
          ]

          to_insert = "\n    ".join(permissions)

          if "BLUETOOTH_CONNECT" not in content:
              content = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    ' + to_insert,
                  content,
                  count=1
              )
              with open(path, "w") as f:
                  f.write(content)
              print("Permissions injected.")
          else:
              print("Permissions already present, skipping.")
          PYEOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-link-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signal Link Build ${{ github.run_number }}
          files: ${{ steps.locate_apk.outputs.apk_path }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
